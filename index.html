<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EAE5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Programme">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Programme</title>
<style>
  :root{
    --paper:#E9EAE5;
    --card:#FCFCFA;
    --ink:#15171A;
    --ink-soft:#54585A;
    --rule:#C9CBC4;
    --rule-strong:#9A9D95;

    --jaune:#EFBC00;
    --rouge:#CC2A1E;
    --noir:#1B1D1F;
    --violet:#6A38A6;

    --pad:16px;
    --radius:4px;
  }

  *{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size:17px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- En-tête ---------- */

  .masthead{
    padding:calc(env(safe-area-inset-top) + 20px) var(--pad) 16px;
    border-bottom:2px solid var(--ink);
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .masthead h1{
    margin:0;
    flex:1 1 auto;
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.05;
  }

  .masthead select{
    appearance:none;
    -webkit-appearance:none;
    flex:0 0 auto;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    background:var(--card);
    color:var(--ink);
    font:inherit;
    font-size:14px;
    font-weight:700;
    padding:7px 10px;
    min-height:34px;
    cursor:pointer;
  }

  .masthead select[hidden]{
    display:none;
  }

  .masthead p{
    margin:6px 0 0;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- Onglets ---------- */

  .tabs{
    position:sticky;
    top:0;
    z-index:20;
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
  }

  .tabs button{
    appearance:none;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font:inherit;
    font-weight:800;
    letter-spacing:0.04em;
    padding:15px 8px 13px;
    cursor:pointer;
    border-bottom:4px solid transparent;
    margin-bottom:-2px;
    text-align:center;
  }

  .tabs button .tabname{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.8;
    margin-top:3px;
  }

  .tabs button[aria-selected="true"]{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }

  /* ---------- Bandeau règle ---------- */

  .rulebar{
    padding:11px var(--pad);
    background:var(--ink);
    color:var(--paper);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    gap:12px;
  }

  .rulebar span:last-child{opacity:0.75;font-weight:600;}

  /* ---------- Liste ---------- */

  .panel{padding:14px var(--pad) 8px;}
  .panel[hidden]{display:none;}

  .exo{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:13px 13px 11px;
    margin-bottom:11px;
  }

  .exo.is-done{
    border-color:var(--rule-strong);
    background:#F0F1EC;
  }

  .exo.is-done .exo-name{
    text-decoration:line-through;
    text-decoration-thickness:2px;
    color:var(--ink-soft);
  }

  .exo-top{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }

  .tick{
    flex:0 0 auto;
    width:30px;
    height:30px;
    margin-top:2px;
    border:2px solid var(--ink);
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    padding:0;
    display:grid;
    place-items:center;
    color:transparent;
    font-size:16px;
    font-weight:900;
    line-height:1;
  }

  .exo.is-done .tick{
    background:var(--ink);
    color:var(--paper);
  }

  .exo-head{flex:1 1 auto;min-width:0;}

  .exo-group{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:3px;
  }

  .exo-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1.2;
    display:block;
  }

  .exo-note{
    display:block;
    margin-top:5px;
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.35;
  }

  .exo-reps{
    flex:0 0 auto;
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.02em;
    white-space:nowrap;
    padding-top:14px;
  }

  .exo-reps small{
    display:block;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- Élastiques ---------- */

  .bands{
    margin-top:11px;
    padding-top:10px;
    border-top:1px solid var(--rule);
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }

  .bands-label{
    width:100%;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:1px;
  }

  .band{
    appearance:none;
    cursor:pointer;
    padding:0;
    flex:1 1 0;
    min-width:0;
    max-width:60px;
    height:34px;
    border-radius:17px;
    border:2px solid var(--c);
    background:transparent;
    position:relative;
    transition:background-color .12s ease, transform .12s ease;
  }

  .band::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:11px;
    border:2px solid var(--c);
    opacity:0.35;
  }

  .band[aria-pressed="true"]{
    background:var(--c);
    transform:scale(1.04);
  }

  .band[aria-pressed="true"]::after{
    inset:6px;
    border-color:var(--card);
    opacity:0.9;
  }

  .band[data-band="noir"][aria-pressed="true"]::after{border-color:#B9BCB5;}

  .band-none{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- Kettlebell ---------- */

  .kb{
    appearance:none;
    cursor:pointer;
    padding:0;
    flex:1 1 0;
    min-width:0;
    max-width:60px;
    height:34px;
    border-radius:17px;
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:14px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    transition:background-color .12s ease, transform .12s ease;
  }

  .kb[aria-pressed="true"]{
    background:var(--ink);
    color:var(--paper);
    transform:scale(1.04);
  }

  /* ---------- Pied de page ---------- */

  .actions{
    margin-top:16px;
    border-top:2px solid var(--ink);
    padding:18px var(--pad) 34px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .actions button{
    appearance:none;
    font:inherit;
    font-size:14px;
    font-weight:700;
    padding:13px;
    border-radius:var(--radius);
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }

  .actions .danger{
    border-color:var(--rule-strong);
    color:var(--ink-soft);
    font-weight:600;
  }

  .saved{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:0 var(--pad) 8px;
    min-height:18px;
  }

  /* ---------- Aide d'exercice ---------- */

  .help{
    appearance:none;
    display:inline-block;
    margin-top:6px;
    padding:6px 0;
    min-height:30px;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font:inherit;
    font-size:13px;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }

  .sheet{
    position:fixed;
    inset:0;
    z-index:60;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }

  .sheet[hidden]{display:none;}

  .sheet-bar{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
    border-bottom:2px solid var(--ink);
  }

  .sheet-bar button{
    appearance:none;
    font:inherit;
    font-size:14px;
    font-weight:700;
    padding:9px 18px;
    min-height:34px;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }

  .sheet-body{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px var(--pad) calc(env(safe-area-inset-bottom) + 40px);
  }

  .sheet-body h2{
    margin:0 0 7px;
    font-size:25px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.1;
  }

  .sheet-resume{
    margin:0;
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.4;
  }

  .sheet-body h3{
    margin:20px 0 9px;
    padding-top:15px;
    border-top:1px solid var(--rule);
    font-size:11px;
    font-weight:800;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .sheet-body ol,
  .sheet-body ul{
    margin:0;
    padding-left:21px;
  }

  .sheet-body li{
    margin-bottom:9px;
    line-height:1.4;
  }

  .sheet-body p{
    margin:0;
    line-height:1.4;
  }

  :focus-visible{
    outline:3px solid var(--violet);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="masthead">
  <h1 id="title"></h1>
  <select id="prog-select" aria-label="Programme" hidden></select>
</header>

<!-- Onglets et panneaux : construits en JS à partir du programme courant. -->
<nav class="tabs" role="tablist" id="tabs"></nav>

<div class="rulebar">
  <span id="rule"></span>
  <span id="progress">0/0</span>
</div>

<main id="panels"></main>

<div class="actions">
  <button id="reset-ticks">Décocher tous les exercices</button>
  <button id="reset-charges" class="danger">Effacer les charges mémorisées</button>
</div>

<!-- Panneau d'aide : rempli en JS à l'ouverture, vide le reste du temps. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titre" hidden>
  <div class="sheet-bar">
    <button type="button" id="sheet-close">Fermer</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<p class="saved" id="saved"></p>
<p class="saved">version 9</p>

<!-- Aides d'exercice, partagées par tous les programmes. -->
<script src="aides.js"></script>

<!-- Un fichier par programme. Ajouter un programme = ajouter une ligne ici
     (et la même dans ASSETS de sw.js). -->
<script src="programmes/01-elastique.js"></script>
<script src="programmes/02-kettlebell.js"></script>

<script>
(function(){
  "use strict";

  /* ---------- Stockage : localStorage, avec repli mémoire ---------- */

  var mem = {};
  var store = {
    get:function(k){
      try{ return window.localStorage.getItem(k); }
      catch(e){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; }
    },
    set:function(k,v){
      try{ window.localStorage.setItem(k,v); }
      catch(e){ mem[k]=v; }
    },
    remove:function(k){
      try{ window.localStorage.removeItem(k); }
      catch(e){ delete mem[k]; }
    }
  };

  var BANDS = [
    {id:"jaune",  color:"#EFBC00", label:"Jaune"},
    {id:"rouge",  color:"#CC2A1E", label:"Rouge"},
    {id:"noir",   color:"#1B1D1F", label:"Noir"},
    {id:"violet", color:"#6A38A6", label:"Violet"},
    {id:"vert",   color:"#1E8A4C", label:"Vert"}
  ];

  var KETTLEBELLS = [
    {id:"8",  label:"8"},
    {id:"12", label:"12"},
    {id:"16", label:"16"},
    {id:"20", label:"20"},
    {id:"24", label:"24"}
  ];

  /* ---------- Programmes : un fichier par programme dans « programmes/ » ---------- */

  var PROGS = window.PROGRAMMES || [];

  if(!PROGS.length){
    document.getElementById("saved").textContent =
      "Aucun programme chargé — vérifie le dossier « programmes ».";
    return;
  }

  function pickProg(id){
    var found = null;
    PROGS.forEach(function(p){ if(p.id === id){ found = p; } });
    return found || PROGS[0];
  }

  /* ---------- Migration unique des réglages d'avant les programmes ---------- */

  function migrate(){
    if(store.get("prog.migrated.v6")){ return; }

    var legacy = null;
    PROGS.forEach(function(p){ if(p.id === "elastiques"){ legacy = p; } });

    if(legacy){
      legacy.seances.forEach(function(s){
        s.exos.forEach(function(e){
          var bands = store.get("prog.band." + e.id);
          if(bands !== null){
            store.set("prog.band.elastiques." + e.id, bands);
            store.remove("prog.band." + e.id);
          }
        });
      });

      var oldTicks = store.get("prog.ticks");
      if(oldTicks !== null){
        store.set("prog.ticks.elastiques", oldTicks);
        store.remove("prog.ticks");
      }

      var oldTab = store.get("prog.tab");
      if(oldTab !== null){
        store.set("prog.tab.elastiques", oldTab);
        store.remove("prog.tab");
      }
    }

    store.set("prog.migrated.v6", "1");
  }

  migrate();

  /* ---------- Programme courant et clés de stockage qui en découlent ---------- */

  var prog = pickProg(store.get("prog.current"));

  function seance(key){
    var found = null;
    prog.seances.forEach(function(s){ if(s.id === key){ found = s; } });
    return found || prog.seances[0];
  }

  function bandKey(exoId){ return "prog.band." + prog.id + "." + exoId; }
  function kbKey(exoId){ return "prog.kb." + prog.id + "." + exoId; }
  function ticksKey(){ return "prog.ticks." + prog.id; }
  function tabKey(){ return "prog.tab." + prog.id; }

  /* ---------- Coches : remises à zéro chaque nouveau jour ---------- */

  var today = new Date().toISOString().slice(0,10);
  var ticks = loadTicks();

  function loadTicks(){
    try{
      var raw = store.get(ticksKey());
      var parsed = raw ? JSON.parse(raw) : null;
      if(parsed && parsed.date === today){ return parsed.done || {}; }
    }catch(e){ /* stockage illisible : on repart à vide */ }
    return {};
  }

  function saveTicks(){
    store.set(ticksKey(), JSON.stringify({date:today, done:ticks}));
    flash("Enregistré");
  }

  function getBands(id){
    try{
      var v = store.get(bandKey(id));
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }

  function setBands(id, list){
    store.set(bandKey(id), JSON.stringify(list));
    flash("Élastique enregistré");
  }

  /* Une seule kettlebell à la fois : on stocke un poids, pas une liste. */

  function getKb(id){
    return store.get(kbKey(id)) || "";
  }

  function setKb(id, poids){
    if(poids){ store.set(kbKey(id), poids); } else { store.remove(kbKey(id)); }
    flash(poids ? "Kettlebell enregistrée" : "Kettlebell effacée");
  }

  var flashTimer = null;
  function flash(msg){
    var el = document.getElementById("saved");
    el.textContent = msg;
    if(flashTimer){ clearTimeout(flashTimer); }
    flashTimer = setTimeout(function(){ el.textContent = ""; }, 1600);
  }

  /* ---------- Panneau d'aide ---------- */

  /* Le contenu vient de aides.js ; un exercice s'y relie par son champ « aide ».
     Clé absente du catalogue : la carte n'affiche simplement pas de bouton. */

  var AIDES = window.AIDES || {};

  var sheet = document.getElementById("sheet");
  var sheetBody = document.getElementById("sheet-body");
  var sheetClose = document.getElementById("sheet-close");
  var sheetSource = null;

  function blocAide(titre, items, ordonne){
    if(!items || !items.length){ return; }

    var h = document.createElement("h3");
    h.textContent = titre;
    sheetBody.appendChild(h);

    var liste = document.createElement(ordonne ? "ol" : "ul");
    items.forEach(function(texte){
      var li = document.createElement("li");
      li.textContent = texte;
      liste.appendChild(li);
    });
    sheetBody.appendChild(liste);
  }

  function ouvrirAide(cle, source){
    var aide = AIDES[cle];
    if(!aide){ return; }

    sheetBody.textContent = "";

    var titre = document.createElement("h2");
    titre.id = "sheet-titre";
    titre.textContent = aide.titre;
    sheetBody.appendChild(titre);

    var resume = document.createElement("p");
    resume.className = "sheet-resume";
    resume.textContent = aide.resume;
    sheetBody.appendChild(resume);

    blocAide("Installation", aide.installation, true);
    blocAide("Le mouvement", aide.mouvement, true);
    blocAide("Réglage de la difficulté", aide.reglage, false);
    blocAide("Raté si", aide.rate, false);

    if(aide.pourquoi){
      var h = document.createElement("h3");
      h.textContent = "Pourquoi cet exercice";
      sheetBody.appendChild(h);

      var texte = document.createElement("p");
      texte.textContent = aide.pourquoi;
      sheetBody.appendChild(texte);
    }

    sheetSource = source || null;
    sheet.hidden = false;
    document.body.style.overflow = "hidden";
    sheetBody.scrollTop = 0;
    sheetClose.focus();
  }

  function fermerAide(){
    if(sheet.hidden){ return; }
    sheet.hidden = true;
    sheetBody.textContent = "";
    document.body.style.overflow = "";
    if(sheetSource){ sheetSource.focus(); }
    sheetSource = null;
  }

  sheetClose.addEventListener("click", fermerAide);

  /* Panneau ouvert : Échap ferme, et le focus ne sort pas du panneau. */
  document.addEventListener("keydown", function(e){
    if(sheet.hidden){ return; }
    if(e.key === "Escape" || e.keyCode === 27){ fermerAide(); return; }
    if(e.key === "Tab" || e.keyCode === 9){
      e.preventDefault();
      sheetClose.focus();
    }
  });

  /* ---------- Matériel d'un exercice ---------- */

  /* « charge » liste le matériel de l'exercice : ["elastique"], ["kettlebell"],
     les deux, ou [] pour le poids du corps. Les programmes antérieurs n'ont que
     « band » : true vaut ["elastique"], false vaut []. */

  function chargeDe(exo){
    if(exo.charge){ return exo.charge; }
    return exo.band ? ["elastique"] : [];
  }

  function buildRow(labelText){
    var row = document.createElement("div");
    row.className = "bands";

    var label = document.createElement("span");
    label.className = "bands-label";
    label.textContent = labelText;
    row.appendChild(label);

    return row;
  }

  function rowPoidsDuCorps(){
    var row = buildRow("Charge");

    var none = document.createElement("span");
    none.className = "band-none";
    none.textContent = "Poids du corps";
    row.appendChild(none);

    return row;
  }

  function rowElastiques(exo){
    var row = buildRow("Élastique");
    var selected = getBands(exo.id);

    BANDS.forEach(function(b){
      var btn = document.createElement("button");
      btn.className = "band";
      btn.type = "button";
      btn.dataset.band = b.id;
      btn.style.setProperty("--c", b.color);
      btn.setAttribute("aria-label", b.label + " — " + exo.name);
      btn.setAttribute("aria-pressed", selected.indexOf(b.id) !== -1 ? "true" : "false");

      btn.addEventListener("click", function(){
        var list = getBands(exo.id);
        var i = list.indexOf(b.id);
        if(i === -1){ list.push(b.id); } else { list.splice(i,1); }
        list.sort(function(x,y){
          return BANDS.map(function(z){return z.id;}).indexOf(x) -
                 BANDS.map(function(z){return z.id;}).indexOf(y);
        });
        setBands(exo.id, list);
        btn.setAttribute("aria-pressed", list.indexOf(b.id) !== -1 ? "true" : "false");
      });

      row.appendChild(btn);
    });

    return row;
  }

  function rowKettlebell(exo){
    var row = buildRow("Kettlebell");
    var boutons = [];

    KETTLEBELLS.forEach(function(k){
      var btn = document.createElement("button");
      btn.className = "kb";
      btn.type = "button";
      btn.dataset.kb = k.id;
      btn.textContent = k.label;
      btn.setAttribute("aria-label", "Kettlebell de " + k.label + " kilos — " + exo.name);
      btn.setAttribute("aria-pressed", getKb(exo.id) === k.id ? "true" : "false");

      btn.addEventListener("click", function(){
        var choisi = getKb(exo.id) === k.id ? "" : k.id;
        setKb(exo.id, choisi);
        boutons.forEach(function(b){
          b.setAttribute("aria-pressed", b.dataset.kb === choisi ? "true" : "false");
        });
      });

      boutons.push(btn);
      row.appendChild(btn);
    });

    return row;
  }

  /* ---------- Rendu ---------- */

  function buildExo(exo){
    var card = document.createElement("article");
    card.className = "exo";
    card.dataset.id = exo.id;
    if(ticks[exo.id]){ card.classList.add("is-done"); }

    var top = document.createElement("div");
    top.className = "exo-top";

    var tick = document.createElement("button");
    tick.className = "tick";
    tick.type = "button";
    tick.textContent = "\u2713";
    tick.setAttribute("aria-pressed", ticks[exo.id] ? "true" : "false");
    tick.setAttribute("aria-label", "Marquer « " + exo.name + " » comme fait");
    tick.addEventListener("click", function(){
      var now = !ticks[exo.id];
      if(now){ ticks[exo.id] = true; } else { delete ticks[exo.id]; }
      card.classList.toggle("is-done", now);
      tick.setAttribute("aria-pressed", now ? "true" : "false");
      saveTicks();
      updateProgress();
    });

    var head = document.createElement("div");
    head.className = "exo-head";

    var group = document.createElement("span");
    group.className = "exo-group";
    group.textContent = exo.group;

    var name = document.createElement("span");
    name.className = "exo-name";
    name.textContent = exo.name;

    var note = document.createElement("span");
    note.className = "exo-note";
    note.textContent = exo.note;

    head.appendChild(group);
    head.appendChild(name);
    head.appendChild(note);

    if(exo.aide && AIDES[exo.aide]){
      var aide = document.createElement("button");
      aide.className = "help";
      aide.type = "button";
      aide.textContent = "Comment faire ?";
      aide.setAttribute("aria-label", "Comment faire « " + exo.name + " » ?");
      aide.addEventListener("click", function(){ ouvrirAide(exo.aide, aide); });
      head.appendChild(aide);
    }

    var reps = document.createElement("div");
    reps.className = "exo-reps";
    reps.appendChild(document.createTextNode(exo.reps));
    var unit = document.createElement("small");
    unit.textContent = exo.unit;
    reps.appendChild(unit);

    top.appendChild(tick);
    top.appendChild(head);
    top.appendChild(reps);
    card.appendChild(top);

    var kit = chargeDe(exo);

    if(!kit.length){ card.appendChild(rowPoidsDuCorps()); }
    if(kit.indexOf("elastique") !== -1){ card.appendChild(rowElastiques(exo)); }
    if(kit.indexOf("kettlebell") !== -1){ card.appendChild(rowKettlebell(exo)); }

    return card;
  }

  function render(){
    document.title = prog.title;
    document.getElementById("title").textContent = prog.title;
    document.getElementById("rule").textContent = prog.rule;

    var tabs = document.getElementById("tabs");
    var panels = document.getElementById("panels");
    tabs.textContent = "";
    panels.textContent = "";

    prog.seances.forEach(function(s){
      var tab = document.createElement("button");
      tab.type = "button";
      tab.id = "tab-" + s.id;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", "panel-" + s.id);
      tab.setAttribute("aria-selected", "false");
      tab.appendChild(document.createTextNode(s.tab));

      var sub = document.createElement("span");
      sub.className = "tabname";
      sub.textContent = s.label;
      tab.appendChild(sub);

      tab.addEventListener("click", function(){
        selectTab(s.id);
        window.scrollTo(0,0);
      });
      tabs.appendChild(tab);

      var panel = document.createElement("section");
      panel.className = "panel";
      panel.id = "panel-" + s.id;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", "tab-" + s.id);
      panel.hidden = true;
      s.exos.forEach(function(exo){ panel.appendChild(buildExo(exo)); });
      panels.appendChild(panel);
    });

    selectTab(current);
  }

  /* ---------- Onglets ---------- */

  var current = storedTab();

  function storedTab(){
    var key = store.get(tabKey());
    var found = null;
    prog.seances.forEach(function(s){ if(s.id === key){ found = s.id; } });
    return found || prog.seances[0].id;
  }

  function selectTab(key){
    current = seance(key).id;
    store.set(tabKey(), current);
    prog.seances.forEach(function(s){
      var isOn = (s.id === current);
      document.getElementById("tab-" + s.id).setAttribute("aria-selected", isOn ? "true" : "false");
      document.getElementById("panel-" + s.id).hidden = !isOn;
    });
    updateProgress();
  }

  function updateProgress(){
    var list = seance(current).exos;
    var done = list.filter(function(e){ return ticks[e.id]; }).length;
    document.getElementById("progress").textContent = done + "/" + list.length;
  }

  /* ---------- Sélecteur de programme ---------- */

  var progSelect = document.getElementById("prog-select");

  PROGS.forEach(function(p){
    var opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    progSelect.appendChild(opt);
  });

  progSelect.value = prog.id;
  progSelect.hidden = PROGS.length < 2;

  progSelect.addEventListener("change", function(){
    selectProg(progSelect.value);
  });

  function selectProg(id){
    prog = pickProg(id);
    store.set("prog.current", prog.id);
    progSelect.value = prog.id;
    ticks = loadTicks();
    current = storedTab();
    render();
    window.scrollTo(0,0);
  }

  /* ---------- Boutons de remise à zéro ---------- */

  document.getElementById("reset-ticks").addEventListener("click", function(){
    ticks = {};
    saveTicks();
    render();
  });

  document.getElementById("reset-charges").addEventListener("click", function(){
    if(!window.confirm("Effacer toutes les charges mémorisées de ce programme ?")){ return; }
    prog.seances.forEach(function(s){
      s.exos.forEach(function(e){
        store.remove(bandKey(e.id));
        store.remove(kbKey(e.id));
      });
    });
    render();
    flash("Charges effacées");
  });

  render();

  /* ---------- Hors connexion (ignoré si sw.js est absent) ---------- */

  if("serviceWorker" in navigator){
    var refreshing = false;

    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(refreshing){ return; }
      refreshing = true;
      window.location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        reg.update();
        setInterval(function(){ reg.update(); }, 60 * 60 * 1000);
      }).catch(function(){ /* sans effet */ });
    });
  }
})();
</script>
</body>
</html>
